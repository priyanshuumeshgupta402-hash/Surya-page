    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHI VIP CHANNEL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #050b14 0%, #0a1128 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        /* Profile Image Setup */
        .profile-img-container {
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #1f2937, #374151);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* VIP Box styling */
        .vip-box {
            background-color: #374151;
            color: #ef4444;
            font-weight: 800;
            font-size: 22px;
            padding: 15px 10px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Main Heading */
        .main-heading {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* Telegram Button */
        .telegram-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: linear-gradient(90deg, #00d2ff 0%, #00f2fe 100%);
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
            font-weight: 800;
            padding: 18px 20px;
            border-radius: 50px;
            border: 2px dashed #ffffff;
            margin-bottom: 40px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
        }

        .telegram-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
            border-style: solid;
        }

        .telegram-btn i {
            font-size: 24px;
        }

        /* Countdown Timer */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-box .number {
            color: #ef4444;
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
        }

        .time-box .number::after {
            content: ':';
            color: #ef4444;
            margin-left: 15px;
        }
        
        .time-box:last-child .number::after {
            display: none;
        }

        .time-box .label {
            font-size: 12px;
            color: #e5e7eb;
            letter-spacing: 1px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-img-container">
            <img src="https://i.ibb.co/Rk7dD7nS/IMG-20260905-163142-961.jpg" alt="Rahi Profile">
        </div>

        <div class="vip-box">
            RAHI VIP CHANNEL
        </div>

        <h1 class="main-heading">NUMBER SURSHOT CHANNEL</h1>

        <a href="https://t.me/+aX0HaxG6dNJhODc1" id="telegramLink" class="telegram-btn" target="_blank">
            <i class="fab fa-telegram-plane"></i>
            JOIN FREE TELEGRAM
            <i class="fab fa-telegram-plane"></i>
        </a>

        <div class="countdown">
            <div class="time-box">
                <span class="number">00</span>
                <span class="label">DAYS</span>
            </div>
            <div class="time-box">
                <span class="number">10</span>
                <span class="label">HOURS</span>
            </div>
            <div class="time-box">
                <span class="number">00</span>
                <span class="label">MINUTES</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">01</span>
                <span class="label">SECONDS</span>
            </div>
        </div>
    </div>

    <script>
        let totalSeconds = 100;
        const telegramURL = "https://t.me/+3vAGuBln5Q1hOTRl";

        const timerInterval = setInterval(function() {
            totalSeconds--;

            if (totalSeconds <= 0) {
                document.getElementById('seconds').innerText = '00';
                clearInterval(timerInterval);
                
                // Direct Telegram redirect logic
                window.location.href = telegramURL;
            } else {
                document.getElementById('seconds').innerText = totalSeconds < 10 ? '0' + totalSeconds : totalSeconds;
            }
        }, 1000);
    </script>
</body>
